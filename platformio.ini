[platformio]
default_envs = pico2w
src_dir = firmware/src
include_dir = firmware/include
lib_dir = lib

[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wno-unused-parameter
  -DPTEROPTYX_FIRMWARE_VERSION=\"0.1.0\"
build_unflags =
  -std=gnu++11
